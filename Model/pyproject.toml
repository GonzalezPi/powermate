[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clarolab-solar-ai"
version = "1.0.0"
description = "Predicción de generación fotovoltaica con regresión lineal y datos de Open-Meteo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Clarolab" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
solar-ai = "solar_ai.cli:main"

[tool.setuptools.packages.find]
include = ["solar_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
